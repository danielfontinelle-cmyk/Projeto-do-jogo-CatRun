<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CatRun.css">
    <title>Cat Run</title>
</head>
<body>  
<div id="telagamer">

    <div class="informacoes">
        <div class="contadorPeixes">
            <img src="Imagens/peixe.png" id="imgPeixe">
            <span id="x">x</span>
            <span id="peixe">0</span>
            <span id="and">-</span>
        </div>

        <div class="contadorTempo">
            <span>Time:</span>
            <span id="tempo">60</span>
        </div><p></p>
    </div>

    <div id="solo">
        <div id="calcada"></div>

        <img src="Imagens/gatocorrendo.gif" id="gato">

        <div id="rua">
            <div id="faixas"></div>
        </div>
    </div>

    <div id="telaInicio">
        <h1>Cat Run</h1>
        <button id="btnIniciar">Iniciar</button>
    </div>

    <div id="telaGameOver" class="oculto">
        <h2 id="msgFim"></h2>
        <p id="placarFinal"></p>
        <button id="btnReiniciar">Jogar de novo</button>
    </div>

</div>

<script src="CatRun.js"></script>
</body>
</html>
